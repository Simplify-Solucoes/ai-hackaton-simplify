<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini-CRM Lite</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header>
    <h1>Mini-CRM Lite</h1>
    <p>Gestão de clientes, catálogo de produtos e dashboard — hackathon Simplify.</p>
  </header>

  <nav class="navbar">
    <button type="button" class="navlink" data-view="dashboard">Dashboard</button>
    <button type="button" class="navlink" data-view="clientes">Clientes</button>
    <button type="button" class="navlink" data-view="catalogo">Catálogo</button>
    <div class="spacer"></div>
    <div class="auth-badge" id="auth-badge"></div>
  </nav>

  <section class="view" id="view-dashboard">
    <div id="dashboard-stats" class="stat-row"></div>
    <div class="chart-grid">
      <div class="chart-card">
        <h3>Clientes por status</h3>
        <div id="chart-status"></div>
      </div>
      <div class="chart-card">
        <h3>Clientes por plano</h3>
        <div id="chart-plano"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-clientes" hidden>
    <section class="block">
      <h2>Adicionar cliente</h2>
      <form id="form-cliente" class="form-grid">
        <div class="field">
          <label for="input-nome">Nome</label>
          <input id="input-nome" name="nome" type="text" autocomplete="off" />
          <span class="erro" id="erro-nome"></span>
        </div>
        <div class="field">
          <label for="input-plano">Plano</label>
          <select id="input-plano" name="plano">
            <option value="Básico">Básico</option>
            <option value="Pro">Pro</option>
            <option value="Enterprise">Enterprise</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div class="field">
          <label for="input-status">Status inicial</label>
          <select id="input-status" name="status">
            <option value="ativo">Ativo</option>
            <option value="pendente">Pendente</option>
            <option value="inadimplente">Inadimplente</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit">Adicionar cliente</button>
        </div>
      </form>
    </section>

    <div class="card">
      <table>
        <thead>
          <tr><th>Nome</th><th>Plano</th><th>Status</th><th>Alterar</th><th>Remover</th></tr>
        </thead>
        <tbody id="tbody-clientes"></tbody>
      </table>
    </div>

    <div class="log">
      <h2>Log de ações</h2>
      <div id="log"></div>
    </div>
  </section>

  <section class="view" id="view-catalogo" hidden>
    <div id="catalogo-pills" class="filter-pills"></div>
    <div id="catalogo-conteudo"></div>
  </section>
</div>

<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/clientes.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
