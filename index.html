<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini-CRM Lite — Starter</title>

<script>
  if (!localStorage.getItem("auth")) {
    window.location.replace("login.html");
  }
</script>

<style>
  :root {
    --bg:        #f4f6f8;
    --surface:   #ffffff;
    --ink:       #1a1d24;
    --muted:     #6b7280;
    --line:      #e3e7ec;
    --accent:    #0d9488;
    --accent-ink:#0a5f59;

    --ativo-bg:  #e7f6ec;  --ativo-fg:  #157347;
    --pend-bg:   #fdf1dd;  --pend-fg:   #b45309;
    --inad-bg:   #fde3e3;  --inad-fg:   #c02626;

    --radius: 10px;
    --font-ui:   system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
  }

  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 230px;
    background: #1a1d2b;
    color: #c2c7d0;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  .sidebar .brand {
    display: flex; align-items: center; gap: .6rem;
    padding: 1rem 1.1rem;
    color: #fff; font-weight: 650; font-size: 1.05rem;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .sidebar .brand .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    flex-shrink: 0;
  }
  .sidebar nav { padding: .75rem .6rem; flex: 1; }
  .sidebar nav a {
    display: flex; align-items: center; gap: .7rem;
    padding: .6rem .8rem; margin-bottom: .15rem;
    border-radius: 8px; color: #c2c7d0; text-decoration: none;
    font-size: .9rem; font-weight: 500;
    transition: background .15s ease, color .15s ease;
  }
  .sidebar nav a .ico { width: 1.1rem; text-align: center; opacity: .85; }
  .sidebar nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
  .sidebar nav a.ativo { background: var(--accent); color: #fff; }
  .sidebar nav a.sair { color: #f2a3a3; }
  .sidebar nav a.sair:hover { background: rgba(220,38,38,.15); color: #ff8a8a; }

  .content { margin-left: 230px; padding: 2rem 1rem; }

  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 1.5rem; }
  header h1 {
    font-size: 1.35rem; font-weight: 650; letter-spacing: -0.01em; margin: 0;
  }
  header p { margin: .25rem 0 0; color: var(--muted); font-size: .9rem; }

  .bar {
    display: flex; gap: .6rem; align-items: center;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  button {
    font: inherit; font-weight: 550; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
    padding: .5rem .9rem; border-radius: var(--radius);
    transition: background .15s ease;
  }
  button:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  button:focus-visible { outline: 3px solid #99f6e4; outline-offset: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: .8rem 1rem; border-bottom: 1px solid var(--line);
    font-size: .92rem; vertical-align: middle;
  }
  th {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 600; background: #fafbfc;
  }
  tr:last-child td { border-bottom: none; }
  td .nome { font-weight: 550; }

  .badge {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .2rem .6rem; border-radius: 999px;
    font-size: .78rem; font-weight: 600;
  }
  .badge.ativo        { background: var(--ativo-bg); color: var(--ativo-fg); }
  .badge.pendente     { background: var(--pend-bg);  color: var(--pend-fg); }
  .badge.inadimplente { background: var(--inad-bg);  color: var(--inad-fg); }

  select {
    font: inherit; padding: .35rem .5rem; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .log {
    margin-top: 1.25rem; background: #12151c; color: #cfd6e0;
    border-radius: var(--radius); padding: .9rem 1rem;
    font-family: var(--font-mono); font-size: .82rem; min-height: 3rem;
  }
  .log h2 {
    font-family: var(--font-ui); font-size: .72rem; text-transform: uppercase;
    letter-spacing: .06em; color: #8b94a3; margin: 0 0 .5rem; font-weight: 600;
  }
  .log .linha { white-space: pre-wrap; }
  .log .linha.alerta { color: #ff8a8a; }
  .log .vazio { color: #5b6472; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><span class="dot"></span> Hackaton</div>
  <nav>
    <a class="ativo" href="index.html"><span class="ico">👥</span> CRM</a>
    <a href="catalogo.html"><span class="ico">📦</span> Catálogo de produtos</a>
    <a href="clientes.html"><span class="ico">🗂️</span> Clientes</a>
    <a class="sair" href="#" id="link-sair"><span class="ico">⏻</span> Sair</a>
  </nav>
</aside>

<div class="content">
<div class="wrap">
  <header>
    <h1>Mini-CRM Lite</h1>
    <p>Gestão de clientes em memória — starter do hackathon.</p>
  </header>

  <div class="bar">
    <button id="btn-importar">Importar clientes</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Nome</th><th>Plano</th><th>Status</th><th>Alterar</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="log">
    <h2>Log de ações</h2>
    <div id="log"></div>
  </div>
</div>
</div>

<script>
  function statusPadrao() {
    return { valor: "ativo", atualizadoEm: null };
  }

  let clientes = [
    { id: 1, nome: "Ana Souza",   plano: "Pro",        status: statusPadrao() },
    { id: 2, nome: "Bruno Lima",  plano: "Básico",     status: statusPadrao() },
    { id: 3, nome: "Carla Dias",  plano: "Enterprise", status: statusPadrao() },
  ];

  const STATUS = ["ativo", "pendente", "inadimplente"];
  const rotulo = { ativo: "Ativo", pendente: "Pendente", inadimplente: "Inadimplente" };

  function render() {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    for (const c of clientes) {
      const tr = document.createElement("tr");

      const icone = c.status.valor === "inadimplente" ? "⚠ " : "";
      const options = STATUS.map(s =>
        `<option value="${s}" ${s === c.status.valor ? "selected" : ""}>${rotulo[s]}</option>`
      ).join("");

      tr.innerHTML = `
        <td><span class="nome">${c.nome}</span></td>
        <td>${c.plano}</td>
        <td><span class="badge ${c.status.valor}">${icone}${rotulo[c.status.valor]}</span></td>
        <td><select data-id="${c.id}">${options}</select></td>
      `;
      tbody.appendChild(tr);
    }
  }

  function mudarStatus(id, novoValor) {
    const cliente = clientes.find(c => c.id === id);
    cliente.status.valor = novoValor;
    cliente.status.atualizadoEm = new Date().toLocaleTimeString("pt-BR");

    if (novoValor === "inadimplente") {
      registrarLog(`⚠ Ação disparada: ${cliente.nome} ficou INADIMPLENTE (${cliente.status.atualizadoEm})`, true);
    } else {
      registrarLog(`${cliente.nome} → ${rotulo[novoValor]} (${cliente.status.atualizadoEm})`);
    }
    render();
  }

  function registrarLog(texto, alerta = false) {
    const box = document.getElementById("log");
    const vazio = box.querySelector(".vazio");
    if (vazio) vazio.remove();
    const linha = document.createElement("div");
    linha.className = "linha" + (alerta ? " alerta" : "");
    linha.textContent = "› " + texto;
    box.prepend(linha);
  }

  async function importarClientes() {
    registrarLog("TODO: integrar com https://fakestoreapi.com/users");
    alert("Integração pendente — este é um dos desafios! Veja o TODO em importarClientes().");
  }

  document.getElementById("link-sair").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("auth");
    window.location.href = "login.html";
  });

  document.getElementById("tbody").addEventListener("change", (e) => {
    if (e.target.matches("select[data-id]")) {
      mudarStatus(Number(e.target.dataset.id), e.target.value);
    }
  });
  document.getElementById("btn-importar").addEventListener("click", importarClientes);

  document.getElementById("log").innerHTML = '<span class="vazio">Nenhuma ação ainda.</span>';
  render();
</script>
</body>
</html>
