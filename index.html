<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simplify CRM</title>
<script src="auth.js"></script>
<style>
  body {
    min-height: 100vh; display: grid; place-items: center; margin: 0;
    color: #1f2328; background: #f6f8fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; padding: 32px; text-align: center; }
  h1 { margin: 0 0 10px; letter-spacing: -.04em; }
  p { margin: 0 0 24px; color: #656d76; }
  a {
    display: inline-block; padding: 10px 16px; border-radius: 7px;
    color: #fff; background: #1f883d; font-weight: 650; text-decoration: none;
  }
</style>
</head>
<body>
  <main>
    <h1>Simplify CRM</h1>
    <p>Clientes, catálogo e operação em um só lugar.</p>
    <a id="primary-link" href="login.html">Entrar no CRM</a>
  </main>
<script>
  if (CrmAuth.isAuthenticated()) {
    const link = document.getElementById("primary-link");
    link.href = "clientes.html";
    link.textContent = "Abrir CRM";
  }
</script>
</body>
</html>
