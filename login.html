<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Acesse sua conta no Simplify CRM" />
<title>Entrar — Simplify CRM</title>
<script src="auth.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f8fa;
    --surface: #ffffff;
    --ink: #1f2328;
    --muted: #656d76;
    --line: #d0d7de;
    --accent: #1f883d;
    --accent-hover: #1a7f37;
    --danger: #cf222e;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 32px 18px;
    color: var(--ink);
    background: var(--bg);
    font-family: var(--font);
  }

  .login-shell { width: min(100%, 360px); }

  .brand {
    display: grid;
    justify-items: center;
    gap: 12px;
    margin-bottom: 25px;
    color: var(--ink);
    text-decoration: none;
  }

  .brand-mark {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    color: #fff;
    background: #24292f;
    box-shadow: 0 8px 24px rgba(31, 35, 40, .16);
  }

  .brand-mark svg { width: 28px; height: 28px; }
  .brand strong { font-size: 1.45rem; letter-spacing: -.035em; }

  .login-card {
    padding: 22px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 8px 28px rgba(31, 35, 40, .06);
  }

  h1 { margin: 0 0 5px; font-size: 1.2rem; letter-spacing: -.02em; }
  .subtitle { margin: 0 0 22px; color: var(--muted); font-size: .88rem; }

  .form { display: grid; gap: 16px; }
  .field { display: grid; gap: 7px; }
  label { font-size: .84rem; font-weight: 600; }

  input {
    width: 100%;
    min-height: 40px;
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    background: var(--surface);
    font: inherit;
    outline: none;
  }

  input:focus {
    border-color: #0969da;
    box-shadow: 0 0 0 3px rgba(9, 105, 218, .15);
  }

  .submit {
    min-height: 42px;
    border: 1px solid rgba(27, 31, 36, .15);
    border-radius: 7px;
    color: #fff;
    background: var(--accent);
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(27, 31, 36, .1);
  }

  .submit:hover { background: var(--accent-hover); }
  .submit:disabled { cursor: wait; opacity: .7; }

  .error {
    display: none;
    padding: 10px 12px;
    border: 1px solid rgba(207, 34, 46, .35);
    border-radius: 6px;
    color: var(--danger);
    background: #ffebe9;
    font-size: .82rem;
  }
  .error.visible { display: block; }

  .demo {
    margin-top: 16px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--muted);
    background: #f6f8fa;
    font-size: .78rem;
  }
  .demo strong { display: block; margin-bottom: 5px; color: var(--ink); }
  .demo code { color: var(--ink); }
  .demo button {
    margin-top: 9px;
    padding: 0;
    border: 0;
    color: #0969da;
    background: transparent;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .demo button:hover { text-decoration: underline; }

  .back {
    display: block;
    margin-top: 20px;
    color: #0969da;
    font-size: .84rem;
    text-align: center;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="login-shell">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z" />
          <path d="m4.3 7.7 7.7 4.5 7.7-4.5M12 12.2V21" />
        </svg>
      </span>
      <strong>Simplify CRM</strong>
    </a>

    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Entrar na sua conta</h1>
      <p class="subtitle">Use seu acesso da Fake Store API.</p>

      <form class="form" id="login-form">
        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" name="username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <div class="error" id="login-error" role="alert"></div>
        <button class="submit" id="submit-button" type="submit">Entrar</button>
      </form>

      <div class="demo">
        <strong>Acesso de demonstração</strong>
        Usuário: <code>johnd</code><br />
        Senha: <code>m38rmF$</code><br />
        <button id="fill-demo" type="button">Preencher acesso</button>
      </div>
    </section>
    <a class="back" href="index.html">← Voltar para o início</a>
  </main>

<script>
  if (CrmAuth.isAuthenticated()) {
    location.replace(CrmAuth.destinationFromQuery());
  }

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("login-error");
  const submitButton = document.getElementById("submit-button");

  document.getElementById("fill-demo").addEventListener("click", () => {
    form.elements.username.value = "johnd";
    form.elements.password.value = "m38rmF$";
    form.elements.username.focus();
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();
    errorBox.classList.remove("visible");
    submitButton.disabled = true;
    submitButton.textContent = "Entrando...";

    try {
      await CrmAuth.login(
        form.elements.username.value.trim(),
        form.elements.password.value
      );
      location.replace(CrmAuth.destinationFromQuery());
    } catch (error) {
      errorBox.textContent = error.message;
      errorBox.classList.add("visible");
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
