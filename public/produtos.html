<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produtos — Mini-CRM Lite</title>
    <script>
      if (!localStorage.getItem("mcrm_token")) {
        window.location.replace("login.html");
      }
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container pb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-semibold mb-0">Catálogo de produtos</h1>
        <button class="btn btn-primary" id="btn-novo-produto">
          + Novo produto
        </button>
      </div>

      <div class="card table-card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody id="tbody-produtos"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="modal fade" id="modal-produto" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="form-produto">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-produto-titulo">
                Novo produto
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="input-nome" class="form-label">Nome</label>
                <input
                  type="text"
                  class="form-control"
                  id="input-nome"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="input-categoria" class="form-label"
                  >Categoria</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="input-categoria"
                  required
                />
              </div>
              <div class="row">
                <div class="col-6 mb-3">
                  <label for="input-preco" class="form-label">Preço (R$)</label>
                  <input
                    type="number"
                    class="form-control"
                    id="input-preco"
                    min="0"
                    step="0.01"
                    required
                  />
                </div>
                <div class="col-6 mb-3">
                  <label for="input-estoque" class="form-label">Estoque</label>
                  <input
                    type="number"
                    class="form-control"
                    id="input-estoque"
                    min="0"
                    step="1"
                    required
                  />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="shared.js"></script>
    <script>
      iniciarPagina("produtos");

      const ESTOQUE_BAIXO = 5;
      let produtos = [];
      const modalEl = document.getElementById("modal-produto");
      const modal = new bootstrap.Modal(modalEl);
      let modoEdicao = null;

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      async function carregar() {
        try {
          produtos = await apiJson("/api/produtos");
          render();
        } catch (err) {
          showToast(err.message, "danger");
        }
      }

      function render() {
        const tbody = document.getElementById("tbody-produtos");
        tbody.innerHTML = "";

        if (produtos.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="5" class="text-center text-muted py-4">Nenhum produto cadastrado.</td></tr>';
          return;
        }

        for (const p of produtos) {
          const tr = document.createElement("tr");
          const estoqueBaixo = p.estoque < ESTOQUE_BAIXO;

          tr.innerHTML = `
            <td class="fw-semibold">${escapeHtml(p.nome)}</td>
            <td>${escapeHtml(p.categoria)}</td>
            <td>${formatoMoeda(p.preco)}</td>
            <td>
              ${p.estoque}
              ${estoqueBaixo ? '<span class="badge text-bg-danger ms-1">Estoque baixo</span>' : ""}
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-1" data-editar="${p.id}">Editar</button>
              <button class="btn btn-sm btn-outline-danger" data-excluir="${p.id}">Excluir</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      }

      function abrirModalNovo() {
        modoEdicao = null;
        document.getElementById("modal-produto-titulo").textContent =
          "Novo produto";
        document.getElementById("form-produto").reset();
        modal.show();
      }

      function abrirModalEditar(id) {
        const produto = produtos.find((p) => p.id === id);
        modoEdicao = id;
        document.getElementById("modal-produto-titulo").textContent =
          "Editar produto";
        document.getElementById("input-nome").value = produto.nome;
        document.getElementById("input-categoria").value = produto.categoria;
        document.getElementById("input-preco").value = produto.preco;
        document.getElementById("input-estoque").value = produto.estoque;
        modal.show();
      }

      async function salvarProduto(e) {
        e.preventDefault();
        const nome = document.getElementById("input-nome").value.trim();
        const categoria = document
          .getElementById("input-categoria")
          .value.trim();
        const preco = document.getElementById("input-preco").value;
        const estoque = document.getElementById("input-estoque").value;
        if (!nome || !categoria || preco === "" || estoque === "") return;

        try {
          if (modoEdicao) {
            const atualizado = await apiJson(`/api/produtos/${modoEdicao}`, {
              method: "PUT",
              body: JSON.stringify({ nome, categoria, preco, estoque }),
            });
            const idx = produtos.findIndex((p) => p.id === modoEdicao);
            produtos[idx] = atualizado;
            showToast("Produto atualizado com sucesso");
          } else {
            const novo = await apiJson("/api/produtos", {
              method: "POST",
              body: JSON.stringify({ nome, categoria, preco, estoque }),
            });
            produtos.push(novo);
            showToast("Produto criado com sucesso");
          }
          modal.hide();
          render();
        } catch (err) {
          showToast(err.message, "danger");
        }
      }

      async function excluirProduto(id) {
        const produto = produtos.find((p) => p.id === id);
        if (!confirm(`Excluir o produto "${produto.nome}"?`)) return;

        try {
          await apiJson(`/api/produtos/${id}`, { method: "DELETE" });
          produtos = produtos.filter((p) => p.id !== id);
          render();
          showToast("Produto excluído");
        } catch (err) {
          showToast(err.message, "danger");
        }
      }

      document
        .getElementById("tbody-produtos")
        .addEventListener("click", (e) => {
          if (e.target.matches("[data-editar]")) {
            abrirModalEditar(Number(e.target.dataset.editar));
          }
          if (e.target.matches("[data-excluir]")) {
            excluirProduto(Number(e.target.dataset.excluir));
          }
        });

      document
        .getElementById("btn-novo-produto")
        .addEventListener("click", abrirModalNovo);
      document
        .getElementById("form-produto")
        .addEventListener("submit", salvarProduto);

      carregar();
    </script>
  </body>
</html>
