<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Mini-CRM Lite</title>
    <script>
      if (!localStorage.getItem("mcrm_token")) {
        window.location.replace("login.html");
      }
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container pb-5">
      <h1 class="h4 fw-semibold mb-3">Dashboard</h1>

      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <a href="clientes.html" class="text-decoration-none">
            <div class="card stat-card shadow-sm text-bg-primary">
              <div class="card-body">
                <div class="stat-label">Total de clientes</div>
                <div class="stat-valor" id="stat-total-clientes">–</div>
              </div>
            </div>
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="clientes.html" class="text-decoration-none">
            <div class="card stat-card shadow-sm text-bg-danger">
              <div class="card-body">
                <div class="stat-label">Clientes inadimplentes</div>
                <div class="stat-valor" id="stat-inadimplentes">–</div>
              </div>
            </div>
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="produtos.html" class="text-decoration-none">
            <div class="card stat-card shadow-sm text-bg-info">
              <div class="card-body">
                <div class="stat-label">Total de produtos</div>
                <div class="stat-valor" id="stat-total-produtos">–</div>
              </div>
            </div>
          </a>
        </div>
        <div class="col-6 col-lg-3">
          <a href="produtos.html" class="text-decoration-none">
            <div class="card stat-card shadow-sm text-bg-success">
              <div class="card-body">
                <div class="stat-label">Valor total em estoque</div>
                <div class="stat-valor" id="stat-valor-estoque">–</div>
              </div>
            </div>
          </a>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="card table-card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h6 fw-semibold mb-3">Clientes por status</h2>
              <div
                class="status-bar mb-3"
                id="status-bar"
                role="img"
                aria-label="Distribuição de clientes por status"
              ></div>
              <ul class="list-unstyled mb-0" id="status-legenda"></ul>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card table-card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h6 fw-semibold mb-3">Produtos com estoque baixo</h2>
              <div id="lista-estoque-baixo"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="shared.js"></script>
    <script>
      iniciarPagina("dashboard");

      const STATUS_DASH = [
        { chave: "ativo", rotulo: "Ativo", cor: "success" },
        { chave: "pendente", rotulo: "Pendente", cor: "warning" },
        { chave: "inadimplente", rotulo: "Inadimplente", cor: "danger" },
      ];
      const ESTOQUE_BAIXO = 5;

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      async function carregar() {
        try {
          const [clientes, produtos] = await Promise.all([
            apiJson("/api/clientes"),
            apiJson("/api/produtos"),
          ]);
          renderStats(clientes, produtos);
          renderStatusBar(clientes);
          renderEstoqueBaixo(produtos);
        } catch (err) {
          showToast(err.message, "danger");
        }
      }

      function renderStats(clientes, produtos) {
        const inadimplentes = clientes.filter(
          (c) => c.status.valor === "inadimplente",
        ).length;
        const valorEstoque = produtos.reduce(
          (soma, p) => soma + p.preco * p.estoque,
          0,
        );

        document.getElementById("stat-total-clientes").textContent =
          clientes.length;
        document.getElementById("stat-inadimplentes").textContent =
          inadimplentes;
        document.getElementById("stat-total-produtos").textContent =
          produtos.length;
        document.getElementById("stat-valor-estoque").textContent =
          formatoMoeda(valorEstoque);
      }

      function renderStatusBar(clientes) {
        const total = clientes.length;
        const counts = {};
        for (const c of clientes) {
          counts[c.status.valor] = (counts[c.status.valor] || 0) + 1;
        }

        const bar = document.getElementById("status-bar");
        bar.innerHTML = STATUS_DASH.map((s) => {
          const n = counts[s.chave] || 0;
          const pct = total ? (n / total) * 100 : 0;
          if (pct === 0) return "";
          const mostraRotulo = pct >= 12 ? Math.round(pct) + "%" : "";
          return `<div class="segmento bg-${s.cor}" style="width:${pct}%" title="${s.rotulo}: ${n}">${mostraRotulo}</div>`;
        }).join("");

        const ul = document.getElementById("status-legenda");
        ul.innerHTML = STATUS_DASH.map((s) => {
          const n = counts[s.chave] || 0;
          const pct = total ? Math.round((n / total) * 100) : 0;
          return `
            <li class="d-flex align-items-center justify-content-between py-1">
              <span><span class="legend-dot bg-${s.cor} me-2"></span>${s.rotulo}</span>
              <span class="text-secondary">${n} · ${pct}%</span>
            </li>`;
        }).join("");
      }

      function renderEstoqueBaixo(produtos) {
        const baixos = produtos.filter((p) => p.estoque < ESTOQUE_BAIXO);
        const box = document.getElementById("lista-estoque-baixo");

        if (baixos.length === 0) {
          box.innerHTML =
            '<p class="text-secondary mb-0">Nenhum produto com estoque baixo.</p>';
          return;
        }

        box.innerHTML = `
          <ul class="list-group list-group-flush">
            ${baixos
              .map(
                (p) => `
              <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                ${escapeHtml(p.nome)}
                <span class="badge text-bg-danger rounded-pill">${p.estoque} un.</span>
              </li>`,
              )
              .join("")}
          </ul>
        `;
      }

      carregar();
    </script>
  </body>
</html>
