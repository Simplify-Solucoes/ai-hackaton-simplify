<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Mini-CRM Lite</title>
    <script>
      if (localStorage.getItem("mcrm_token")) {
        window.location.replace("index.html");
      }
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="login-body d-flex align-items-center justify-content-center min-vh-100">
    <div class="card login-card shadow">
      <div class="card-body p-4 p-md-5">
        <h1 class="h4 mb-1 fw-semibold">Mini-CRM Lite</h1>
        <p class="text-muted mb-4">Entre com sua conta para continuar</p>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuário</label>
            <input
              type="text"
              class="form-control"
              id="usuario"
              autocomplete="username"
              required
            />
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input
              type="password"
              class="form-control"
              id="senha"
              autocomplete="current-password"
              required
            />
          </div>
          <div id="erro-login" class="alert alert-danger py-2 d-none" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100" id="btn-entrar">
            Entrar
          </button>
        </form>

        <p class="text-muted small mt-4 mb-0">
          Demo: usuário <code>admin</code> / senha <code>admin123</code>
        </p>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      document
        .getElementById("form-login")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const usuario = document.getElementById("usuario").value.trim();
          const senha = document.getElementById("senha").value;
          const erroBox = document.getElementById("erro-login");
          const btn = document.getElementById("btn-entrar");
          erroBox.classList.add("d-none");
          btn.disabled = true;

          try {
            const res = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ usuario, senha }),
            });
            const dados = await res.json();
            if (!res.ok) throw new Error(dados.erro || "Falha no login");

            localStorage.setItem("mcrm_token", dados.token);
            localStorage.setItem("mcrm_usuario", dados.usuario);
            window.location.href = "index.html";
          } catch (err) {
            erroBox.textContent = err.message;
            erroBox.classList.remove("d-none");
          } finally {
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
